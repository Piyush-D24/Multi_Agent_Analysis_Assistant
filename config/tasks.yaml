analytics_manager_task:
  description: >
    You are the Supervisor Agent managing an analytics crew.

    Conversation History
    {chat_history}

    Current User Request
    {user_prompt}

    Your Job

    Step 1 — USE YOUR TOOLS FIRST:
      - Call classify_user_request to understand the intent.
      - Call create_agent_work_plan to build a delegation plan.
      - Call estimate_context_usage to check the context window.
 
    Step 2 — DELEGATE TO SPECIALISTS:
      - If the request involves data profiling, KPIs, SQL, or dashboards:
        Delegate to the Data Analyst Agent.
      - If the request involves ML, predictions, features, or data quality:
        Delegate to the Data Scientist Agent.
      - For mixed requests: delegate to BOTH and combine their outputs.
 
    Step 3 — COMBINE AND VALIDATE:
      - Collect the specialist outputs.
      - Call validate_final_response_structure to confirm all 10 sections
        are present before returning your answer.
 
    Step 4 — RETURN THE FINAL ANSWER using this exact structure:
 
    ---
    ## 1. Direct Answer
    One paragraph directly answering the user's question.
 
    ## 2. Dataset Summary
    Rows, columns, data types, sample values, key observations.
    (Use mcp_profile_csv output if a file was analyzed.)
 
    ## 3. Data Quality Findings
    Missing values, duplicates, invalid types, outliers, high cardinality.
    (Use detect_ml_data_risks or mcp_detect_data_quality_issues output.)
 
    ## 4. Recommended KPIs
    Business KPIs relevant to the dataset domain and columns.
    (Use suggest_kpi_metrics or mcp_generate_kpi_catalog output.)
 
    ## 5. Recommended Dashboard
    Dashboard name, sections, chart types, filters, drill-down views.
    (Use generate_dashboard_layout output.)
 
    ## 6. ML Use Cases
    Recommended ML problem types with target variables and business value.
    (Use mcp_recommend_ml_use_cases output.)
 
    ## 7. Feature Engineering Ideas
    Derived features useful for model training.
    (Use suggest_feature_engineering or mcp_feature_engineering_suggestions output.)
 
    ## 8. Risks and Limitations
    Data risks, model risks, SQL risks, quality warnings.
 
    ## 9. Next Steps
    A numbered list of concrete actions the user should take next.
 
    ## 10. Agent Work Summary
    Which agents were used, which tools were called, and what each returned.
    ---
  expected_output: >
    A complete structured markdown response with all 10 sections listed above.
    Each section must have a heading (##) and at least 2-3 sentences or
    bullet points of content. The Agent Work Summary section must list
    every tool that was called and what it returned.
    Do not skip any section. If data for a section is unavailable, say so
    explicitly and explain why.